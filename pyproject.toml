[project]
name = "AutoSetSyntax"
version = "0.0.0"
description = "Automatically sets syntax based on various strategies."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "more-itertools>=10,<11",
  "pydantic>=2,<3",
  "typing-extensions>=4.11",
]

[dependency-groups]
dev = [
  "mypy>=1.14",
  "ruff>=0.14",
  "vendorize<1",
]
docs = [
  "mkdocs-material==9.*",
  # mkdocs plugins
  "mkdocs-exclude==1.*",
  "mkdocs-git-revision-date-localized-plugin==1.*",
  "mkdocs-minify-plugin==0.8.*",
]

[tool.uv]
default-groups = ["dev"]

[tool.mypy]
# ignore_missing_imports = False
check_untyped_defs = true
strict_optional = true
mypy_path = 'typings:stubs'
python_version = '3.8'

[[tool.mypy.overrides]]
module = [
  "magika.*",
  "plugin._vendor.*",
]
ignore_errors = true
ignore_missing_imports = true

[tool.pyright]
include = ['./']
exclude = [
  '**/__pycache__/',
  '**/node_modules/',
  # git-related
  '**/.git/',
  '**/br-*/',
  '**/branch-*/',
]
ignore = ['**/.venv', '**/_vendor']
stubPath = 'typings'
pythonVersion = '3.8'

[tool.ruff]
preview = true
line-length = 120
target-version = 'py38'
exclude = [
  "*/libs/*",
  ".git",
  ".mypy_cache",
  ".venv",
  ".venv-*",
  "_vendor",
  "branch-*",
  "stubs",
  "tests/files",
  "typings",
  "venv",
  "venv-*",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "FURB",
  "SIM",
]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"boot.py" = ["E402"]
